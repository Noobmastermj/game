<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Battler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{--bg:#e8edf6;--sf:#fff;--tx:#1b2340;--mu:#5d6785;--bd:#c9d1e3;--hp:#d64545;--bl:#2f80ed;--en:#d9971a;--at:#e4572e;--df:#2f80ed;--ut:#2a9d6f;--ac:#5a3fe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a2e;--sf:#23264a;--tx:#eceffd;--mu:#a3abd0;--bd:#3a3f70;--ac:#8b78ff}}
:root[data-theme="dark"]{--bg:#181a2e;--sf:#23264a;--tx:#eceffd;--mu:#a3abd0;--bd:#3a3f70;--ac:#8b78ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:10px;padding:12px;box-sizing:border-box;overflow-y:auto}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px}
.col{margin:auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700;font-size:18px}
.bar{height:12px;border-radius:6px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--hp);transition:width .4s}
.tag{font-size:14px;color:var(--mu)}
.intent{font-weight:600;color:var(--at);font-size:14px}
.stats{display:flex;gap:14px;font-weight:600}
.stats .bl{color:var(--bl)}.stats .en{color:var(--en)}
#log{text-align:center;color:var(--mu);min-height:22px}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.card{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-top:6px solid var(--ut);border-radius:12px;padding:8px 6px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;cursor:pointer}
.card.a{border-top-color:var(--at)}.card.d{border-top-color:var(--df)}
.card b{font-size:18px;color:var(--en)}
.card span{font-weight:700}
.card small{color:var(--mu);font-size:13px}
.card:disabled{opacity:.4;cursor:default}
.card:focus-visible,.btn:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{font:inherit;font-weight:700;color:#fff;background:var(--ac);border:0;border-radius:12px;padding:14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.over{position:fixed;inset:0;background:rgba(10,12,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.over .panel{max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.over .hand{margin-top:0}
/* battle stage and animation */
.stage{display:flex;align-items:flex-end;gap:6px;padding:14px 8px 10px}
.fx{flex:1;position:relative;text-align:center;border-radius:12px;padding:4px}
.fx.act{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.vs{font-weight:800;color:var(--mu);align-self:center}
.spr{display:inline-block}
.big{display:inline-block;font-size:48px;line-height:1.1;animation:bob 2s ease-in-out infinite}
.l .spr.lunge{animation:lungeR .45s}.r .spr.lunge{animation:lungeL .45s}
.spr.hit{animation:shake .4s .15s}
.float{position:absolute;top:0;left:50%;font-weight:800;font-size:22px;color:var(--hp);animation:up .9s .15s both;pointer-events:none}
.float.ok{color:var(--ut)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes lungeR{40%{transform:translateX(60px) scale(1.15)}}
@keyframes lungeL{40%{transform:translateX(-60px) scale(1.15)}}
@keyframes shake{20%{transform:translateX(-8px);filter:brightness(2)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* mini-game sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;background:var(--sf);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.sheet.go{background:var(--ac);color:#fff}.sheet.go .tag{color:#fff}
.track{position:relative;height:26px;border-radius:13px;margin:8px 4px;background:linear-gradient(90deg,#d64545 0 20%,#e8923a 20% 34%,#3aa86f 34% 44%,#f2c230 44% 56%,#3aa86f 56% 66%,#e8923a 66% 80%,#d64545 80%)}
#mk{position:absolute;left:0;top:-5px;width:6px;height:36px;border-radius:3px;background:var(--tx);border:2px solid var(--sf);transform:translateX(-50%)}
.sheet .btn{padding:18px;font-size:20px}
.fx .name{font-size:15px}
.fx.dead{opacity:.45}
body{touch-action:manipulation;-webkit-touch-callout:none}
.arena{position:relative;height:150px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);overflow:hidden}
.tgt{position:absolute;width:58px;height:58px;border-radius:50%;border:0;font-size:30px;background:var(--at);display:none;padding:0}
.btn .tag{color:inherit;opacity:.75;font-weight:400}
#app{transition:transform .35s}
.sheet.cd .btn{opacity:.35}
.sheet.fake{background:var(--at);color:#fff}.sheet.fake .tag{color:#fff}
.arena{height:170px}
/* computer layout */
.pc #app{max-width:1040px;padding:20px;gap:14px}
.pc .stage{padding:22px 24px 16px}
.pc .big{font-size:84px}
.pc .fx .name{font-size:18px}
.pc .vs{font-size:22px}
.pc .hand{grid-template-columns:repeat(5,1fr);gap:12px}
.pc .over .hand{grid-template-columns:repeat(3,1fr)}
.pc .card{min-height:150px;font-size:18px;transition:transform .12s}
.pc .card:not(:disabled):hover{transform:translateY(-6px);border-color:var(--ac)}
.pc .card small{font-size:14px}
.pc .btn{font-size:17px}
.pc .col{max-width:520px}
.pc .over .panel{max-width:760px}
.pc .sheet{max-width:760px}
.pc .arena{height:230px}
.pc .card[data-k]{position:relative}
.pc .card[data-k]::after{content:attr(data-k);position:absolute;top:6px;right:8px;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:0 5px}
.pc .sheet .btn::after{content:" (Space)"}
.pc [data-a="end"]::after{content:" (E)"}
.pc [data-a="go"]::after{content:" (Space)"}
.tgt{width:64px;height:64px}
/* visual polish */
:root{--fd:"Lilita One","Trebuchet MS","Segoe UI",system-ui,sans-serif;--glow:#7a63ff;--sky:#d6e4ff;--sh:0 6px 20px rgba(30,40,90,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#34407a;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--sky:#34407a;--sh:0 6px 20px rgba(0,0,0,.35)}
body{background:radial-gradient(900px 480px at 50% -80px,color-mix(in srgb,var(--glow) 22%,transparent),transparent),var(--bg)}
#app{gap:12px;padding:14px}
.panel{border-radius:18px;box-shadow:var(--sh)}
.name,.card span,.float,.vs{font-family:var(--fd);font-weight:400;letter-spacing:.02em}
.name{font-size:19px}
.col{padding:22px;gap:12px}.col .name{font-size:34px}
.stage{background:radial-gradient(120% 100% at 50% 0%,var(--sky),transparent 75%),var(--sf);border-radius:20px}
.fx{border-radius:14px;padding:6px 4px;transition:background .3s,box-shadow .3s}
.fx.act{box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 55%,transparent)}
.fx.dead{filter:grayscale(1)}
.spr{position:relative;padding-bottom:8px}
.spr::after{content:"";position:absolute;left:50%;bottom:0;width:64%;height:12px;border-radius:50%;background:rgba(0,0,0,.2);transform:translateX(-50%);filter:blur(3px)}
.vs{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tx);color:var(--sf);font-size:14px}
.bar{height:14px;border-radius:7px;background:color-mix(in srgb,var(--tx) 13%,transparent);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.bar i{border-radius:7px;background:linear-gradient(90deg,#e0524f,#f28b5c)}
.fx.l .bar i{background:linear-gradient(90deg,#2fa36b,#72d6a0)}
.fx .tag{font-size:13px}
.intent{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--at) 16%,transparent)}
#log{padding:9px 14px;border-radius:14px;background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx);font-size:15px}
.stats span{padding:5px 13px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.stats .bl::before{content:"🛡️ "}.stats .en::before{content:"⚡ "}
.hand{gap:10px}
.card,.card.a,.card.d{--cc:var(--ut);position:relative;justify-content:center;gap:5px;padding:18px 8px 10px;border:1px solid color-mix(in srgb,var(--cc) 45%,var(--bd));border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 20%,var(--sf)),var(--sf) 60%);box-shadow:0 4px 12px rgba(0,0,0,.12);transition:transform .12s}
.card.a{--cc:var(--at)}.card.d{--cc:var(--df)}
.card b{position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--en);color:#fff;font:400 16px var(--fd);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.card span{font-size:16px}
.card span::before{content:"✨";display:block;font-size:24px;margin-bottom:2px}
.card.a span::before{content:"⚔️"}.card.d span::before{content:"🛡️"}
.card small{line-height:1.25}
.card:not(:disabled):active{transform:scale(.96)}
.card:disabled{filter:grayscale(.7)}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));border-radius:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 60%,#000),0 8px 16px rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.btn.alt{background:var(--sf);box-shadow:0 3px 0 var(--bd)}
.btn .tag{display:block;margin-top:2px;font-size:13px}
.over{backdrop-filter:blur(5px)}
.sheet{border-radius:22px 22px 0 0;padding-top:22px}
.sheet::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--bd);margin:-12px auto 0}
.sheet.go::before,.sheet.fake::before{background:rgba(255,255,255,.5)}
.track{box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.arena{background:repeating-linear-gradient(45deg,transparent 0 14px,color-mix(in srgb,var(--tx) 5%,transparent) 14px 28px),var(--bg)}
.tgt{background:radial-gradient(circle at 35% 30%,#ff9a76,var(--at));box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);font-size:16px;cursor:pointer;padding:0;flex:none}
.col .ico{margin:0 auto}
.hand.deal .card{animation:deal .4s backwards}
.hand.deal .card:nth-child(2){animation-delay:.06s}.hand.deal .card:nth-child(3){animation-delay:.12s}.hand.deal .card:nth-child(4){animation-delay:.18s}.hand.deal .card:nth-child(5){animation-delay:.24s}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(-6deg) scale(.9)}}
.quake{animation:quake .4s .1s}
@keyframes quake{25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- Game data: add or edit cards, classes, enemies and difficulties here ----
// c = energy cost, d = damage, x = hits, b = block, h = heal, dr = draw, k = class, m = attack mini-game
// mini-games: time (stop the marker), hold (charge and release), mash (tap fast), target (tap targets)
const CARDS = {
  strike:      {n:"Strike",       c:1, d:6,         m:"time",   k:"knight", t:"Deal 6"},
  bash:        {n:"Shield Bash",  c:2, d:11,        m:"mash",   k:"knight", t:"Deal 11"},
  smite:       {n:"Smite",        c:3, d:19,        m:"hold",   k:"knight", t:"Deal 19"},
  spark:       {n:"Spark",        c:1, d:3, x:3,    m:"target", k:"mage",   t:"Deal 3 three times"},
  frost:       {n:"Frost Bolt",   c:2, d:10,        m:"time",   k:"mage",   t:"Deal 10"},
  fireball:    {n:"Fireball",     c:3, d:22,        m:"hold",   k:"mage",   t:"Deal 22"},
  stab:        {n:"Quick Stab",   c:1, d:5,         m:"mash",   k:"rogue",  t:"Deal 5"},
  slash:       {n:"Double Slash", c:2, d:8, x:2,    m:"target", k:"rogue",  t:"Deal 8 twice"},
  assassinate: {n:"Assassinate",  c:3, d:20,        m:"time",   k:"rogue",  t:"Deal 20"},
  defend: {n:"Defend",    c:1, b:5,  t:"Gain 5 block"},
  wall:   {n:"Iron Wall", c:2, b:12, t:"Gain 12 block"},
  mend:   {n:"Mend",      c:1, h:5,  t:"Heal 5"},
  focus:  {n:"Focus",     c:0, dr:2, t:"Draw 2 cards"}
};
Object.assign(CARDS, {
  rally:  {n:"Rally",        c:1, s:2,       k:"knight", t:"Gain 2 Strength"},
  venom:  {n:"Venom Stab",   c:1, d:3, p:3,  m:"mash",   k:"rogue",  t:"Deal 3, poison 3"},
  plague: {n:"Plague Cloud", c:2, p:5,       k:"mage",   t:"Poison 5"}
});
const CLASSES = {
  knight: {n:"Knight", e:"🛡️", hp:1.15, d:"Tough melee fighter",
    deck:["strike","strike","strike","strike","bash","bash","defend","defend","defend","defend","mend","wall"]},
  mage:   {n:"Mage",   e:"🧙", hp:.85,  d:"Fragile, big spells",
    deck:["spark","spark","spark","spark","frost","frost","fireball","defend","defend","defend","mend","focus"]},
  rogue:  {n:"Rogue",  e:"🥷", hp:1,    d:"Fast multi-hits",
    deck:["stab","stab","stab","stab","slash","slash","defend","defend","defend","focus","focus","mend"]}
};
const MGN = {time:"timing", hold:"charge", mash:"mash", target:"aim"};
// mv = moves in order: ["a", damage] attacks, ["b", amount] gains block
const ENEMIES = [
  {n:"Slime",  e:"🟢", hp:30, mv:[["a",6],["a",8],["b",6]]},
  {n:"Goblin", e:"👺", hp:42, mv:[["a",9],["b",8],["a",12]]},
  {n:"Dragon", e:"🐉", hp:66, mv:[["a",10],["a",16],["b",12]]}
];
// hp/dmg = enemy multipliers, p = starting HP, w = dodge window size, hide = enemy moves hidden
const DIFF = {
  easy:      {n:"Easy",      hp:.7,  dmg:.7,  p:50, w:1.3},
  normal:    {n:"Normal",    hp:1,   dmg:1,   p:40, w:1},
  hard:      {n:"Hard",      hp:1.4, dmg:1.3, p:35, w:.85},
  nightmare: {n:"Nightmare", hp:1.6, dmg:1.5, p:30, w:.7, hide:1}
};

// big cards (cost 4 or 5) and energy recovery; unspent energy carries over to the next turn
Object.assign(CARDS, {
  slam:     {n:"Titan Slam",   c:4, d:30,       m:"mash",   k:"knight", t:"Deal 30"},
  meteor:   {n:"Meteor",       c:5, d:45,       m:"hold",   k:"mage",   t:"Deal 45"},
  flurry:   {n:"Fatal Flurry", c:4, d:10, x:4,  m:"target", k:"rogue",  t:"Deal 10 four times"},
  recharge: {n:"Recharge",     c:1, e:3,                              t:"Gain 3 energy"}
});
CLASSES.knight.deck.push("slam", "recharge");
CLASSES.mage.deck.push("meteor", "recharge");
CLASSES.rogue.deck.push("flurry", "recharge");
ENEMIES.splice(2, 0, {n:"Ogre", e:"👹", hp:54, mv:[["b",10],["a",14],["a",11]]});
let G = {}, M = {}, wins = 0, diff = "normal", dev = "", mute = false, AC;
try { wins = +localStorage.getItem("cb_wins") || 0; dev = localStorage.getItem("cb_dev") || ""; mute = localStorage.getItem("cb_mute") === "1"; if (localStorage.getItem("cb_tut") !== "1") M.help = true; } catch (e) {}
document.body.classList.toggle("pc", dev === "pc");
function setDev(v) { dev = v; try { localStorage.setItem("cb_dev", v); } catch (e) {} document.body.classList.toggle("pc", v === "pc"); }

// ---- Sound (synthesized, no files) and vibration ----
function tone(f, d, ty, v, to, w) {
  const a = AC, t = a.currentTime + (w || 0), o = a.createOscillator(), g = a.createGain();
  o.type = ty; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
function noise(d, v) {
  const a = AC, n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = b; g.gain.value = v; s.connect(g); g.connect(a.destination); s.start();
}
const SFX = {
  card: () => tone(520, .08, "triangle", .1, 780),
  click: () => tone(700, .03, "square", .04),
  tick: () => tone(440, .08, "sine", .1),
  hit: () => { noise(.18, .25); tone(160, .2, "sawtooth", .12, 50); },
  big: () => SFX.hit(),
  block: () => tone(300, .12, "square", .08, 200),
  whoosh: () => { noise(.25, .1); tone(900, .25, "sine", .05, 200); },
  perfect: () => [660, 880, 1100].forEach((f, i) => tone(f, .14, "triangle", .1, 0, i * .07)),
  ok: () => tone(600, .1, "triangle", .1, 800),
  miss: () => tone(300, .25, "sawtooth", .08, 90),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, "triangle", .12, 0, i * .12)),
  lose: () => [400, 330, 262, 196].forEach((f, i) => tone(f, .25, "sawtooth", .1, 0, i * .18))
};
const VIB = {hit: 40, big: 90, perfect: [20, 30, 20], miss: 60, whoosh: 15};
function sfx(n) {
  try {
    if (dev !== "pc" && VIB[n] && navigator.vibrate) navigator.vibrate(VIB[n]);
    if (mute) return;
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    if (SFX[n]) SFX[n]();
  } catch (e) {}
}
const muteBtn = () => `<button class="ico" data-a="mute" aria-label="Toggle sound">${mute ? "🔇" : "🔊"}</button>`;
const $ = s => document.querySelector(s);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const alive = i => { for (let j = i; j < G.n; j++) if (G.p[j].hp > 0) return j; return -1; };
const foe = () => G.pvp ? G.p[1 - G.t] : G.p[G.n];

function mk(cls, i, P, cnt) {
  const C = CLASSES[cls], hp = Math.round(P * C.hp);
  return {cls, n: cnt > 1 ? "P" + (i + 1) + " " + C.n : C.n, e: C.e, hp, max: hp, block: 0,
    deck: [...C.deck], dp: shuffle([...C.deck]), dc: [], hand: []};
}
function draw(f, n) {
  while (n-- > 0) {
    if (!f.dp.length) f.dp = shuffle(f.dc.splice(0));
    if (!f.dp.length) break;
    f.hand.push(f.dp.pop());
  }
}
function beginTurn() {
  const f = G.p[G.t];
  if (G.pvp && poisonTick(f)) return;
  f.block = 0; G.energy = Math.min(10, (f.bank || 0) + 3); draw(f, 5); G.deal = 1;
}
// poison hurts at the start of the holder's turn and wears off by 1
function poisonTick(f) {
  if (!f.poison) return false;
  f.hp -= f.poison; G.fx = {i: G.p.indexOf(f), t: "-" + f.poison + "☠"};
  G.log = f.n + " takes " + f.poison + " poison damage."; f.poison--; sfx("hit");
  if (f.hp > 0) return false;
  f.hp = 0;
  if (G.pvp) finish(G.p[1 - G.p.indexOf(f)].n + " wins!"); else win();
  return true;
}
// the enemy picks its next target in advance so co-op players can see it
function aim() {
  const L = [];
  for (let i = 0; i < G.n; i++) if (G.p[i].hp > 0) L.push(i);
  G.p[G.n].tg = L[Math.floor(Math.random() * L.length)];
}

function newGame() {
  const pv = M.mode === "pvp", n = M.cls.length;
  diff = M.d || "normal";
  const P = pv ? 40 : DIFF[diff].p;
  G = {pvp: pv, n, stage: 0, p: M.cls.map((k, i) => mk(k, i, P, n))};
  if (pv) { G.t = 0; G.mode = "pass"; G.log = "P1 goes first."; } else startFight();
}
function startFight() {
  const E = ENEMIES[G.stage], D = DIFF[diff], m = Math.round(E.hp * D.hp * (G.n > 1 ? 1.7 : 1));
  G.p.length = G.n;
  G.p.forEach(f => { f.dp = shuffle([...f.deck]); f.dc = []; f.hand = []; f.str = 0; f.poison = 0; f.bank = 0; });
  G.p[G.n] = {n: E.n, e: E.e, hp: m, max: m, block: 0, i: 0, hand: [],
    mv: E.mv.map(([t, v]) => [t, t === "a" ? Math.round(v * D.dmg) : v])};
  aim();
  G.t = 0; G.log = "A wild " + E.n + " appears!";
  G.mode = G.n > 1 ? "pass" : "play";
  if (G.n === 1) beginTurn();
}

// ---- Playing cards ----
function play(i) {
  const f = G.p[G.t], id = f.hand[i], c = CARDS[id];
  if (G.mode !== "play" || c.c > G.energy || performance.now() < (G.lockUntil || 0)) return;
  G.energy -= c.c; f.hand.splice(i, 1); f.dc.push(id);
  if (c.b) f.block += c.b;
  if (c.h) f.hp = Math.min(f.max, f.hp + c.h);
  if (c.dr) draw(f, c.dr);
  if (c.e) G.energy = Math.min(10, G.energy + c.e);
  if (c.s) f.str = (f.str || 0) + c.s;
  if (c.p && !c.d) foe().poison = (foe().poison || 0) + c.p;
  sfx("card");
  G.log = f.n + " played " + c.n + ".";
  if (c.d) atkMini(f, foe(), c); else render();
}

// ---- Attack mini-games ----
const RT = s => s >= 1 ? ["PERFECT!", 1.25] : s >= .7 ? ["Good hit.", 1] : s >= .35 ? ["Weak hit.", .5] : ["MISS!", 0];
const sc = d => d < .06 ? 1 : d < .16 ? .7 : d < .3 ? .35 : 0;
function atkMini(f, o, c) {
  G.mode = "mini";
  const m = G.mini = {k: c.m, f, o, c, p: 0, n: 0, N: Math.min(16, 6 + 4 * c.c), hits: 0, r: 0, on: 0,
    t0: performance.now(), off: Math.random() * 2, spd: c.c >= 2 ? 1.1 : .8};
  render();
  if (m.k === "mash") m.to = setTimeout(() => fin(RT(Math.min(1, m.n / m.N))), 2000);
  else if (m.k === "target") m.to = setTimeout(nextTarget, 600);
  else loop();
}
function fin(r) {
  const m = G.mini; if (!m || m.done) return;
  m.done = 1; clearTimeout(m.to); G.lockUntil = performance.now() + 800;
  sfx(r[1] >= 1.25 ? "perfect" : r[1] > 0 ? "ok" : "miss");
  if (r[1] > 0 && m.c.p) m.o.poison = (m.o.poison || 0) + m.c.p;
  strike(m.f, m.o, Math.round((m.c.d + (m.f.str || 0)) * (m.c.x || 1) * r[1]), r[0], () => { G.mode = "play"; });
}
function loop() {
  const m = G.mini;
  if (!m || m.done || (m.k !== "time" && m.k !== "hold")) return;
  const t = (performance.now() - m.t0) / 1000;
  if (m.k === "time") { const x = (t * m.spd + m.off) % 2; m.p = x < 1 ? x : 2 - x; }
  else if (m.on) { m.p = Math.min(1, t / 1.5); if (m.p >= 1) return rel(); }
  const el = $("#mk"); if (el) el.style.left = m.p * 100 + "%";
  requestAnimationFrame(loop);
}
function rel() {
  const m = G.mini;
  if (!m || m.k !== "hold" || !m.on || m.done) return;
  m.on = 0; fin(RT(sc(Math.abs(m.p - .5))));
}
function nextTarget() {
  const m = G.mini; if (!m || m.done) return;
  if (m.r >= 3) return fin(RT([0, .4, .7, 1][m.hits]));
  m.r++; m.lock = 0;
  const a = $("#ar"), b = $("#tg"), c = $("#cnt");
  if (a && b) {
    const S = 64;
    b.textContent = "🎯";
    b.style.left = Math.random() * (a.clientWidth - S) + "px";
    b.style.top = Math.random() * (a.clientHeight - S) + "px";
    b.style.display = "block";
  }
  if (c) c.textContent = m.r + " / 3";
  m.to = setTimeout(nextTarget, 1100);
}
function hitT() {
  const m = G.mini;
  if (!m || m.k !== "target" || m.done || m.lock) return;
  m.lock = 1; clearTimeout(m.to); m.hits++;
  $("#tg").textContent = "💥"; sfx("ok");
  m.to = setTimeout(nextTarget, 300);
}
function tap() {
  const m = G.mini;
  if (G.mode !== "mini" || !m || m.done) return;
  if (m.k === "dg") return dodgeTap();
  if (m.k === "time") fin(RT(sc(Math.abs(m.p - .5))));
  else if (m.k === "mash") { m.n++; sfx("click"); const c = $("#cnt"); if (c) c.textContent = m.n; }
  else if (m.k === "hold" && !m.on) { m.on = 1; m.t0 = performance.now(); }
}

// ---- Dodge mini-game: tap only after the NOW signal ----
function dodge(o, title, cb) {
  const W = G.pvp ? 1 : DIFF[diff].w;
  G.mode = "mini";
  const m = G.mini = {k: "dg", o, title, cb, W, go: 0, done: 0, ph: "cd"};
  render();
  const sh = $("#sheet"); if (sh) sh.classList.add("cd");
  let c = G.pvp ? 3 : 1;
  const tick = () => {
    if (m.done) return;
    const el = $("#ds");
    if (c > 0) { if (el) el.textContent = "Dodge starts in " + c; sfx("tick"); c--; m.t = setTimeout(tick, 1000); return; }
    m.ph = "wait";
    if (sh) sh.classList.remove("cd");
    if (el) el.textContent = "Wait for the REAL signal. Fakes will try to trick you!";
    const delay = 800 + Math.random() * 2000;
    if (delay > 1500 && Math.random() < .6) {
      m.t3 = setTimeout(() => {
        const d = $("#dt");
        if (d && !m.go) { d.textContent = "😈 Fake!"; sh.classList.add("fake"); setTimeout(() => { if (!m.go) { d.textContent = m.title; sh.classList.remove("fake"); } }, 500); }
      }, delay * .35);
    }
    m.t = setTimeout(() => {
      m.go = 1; m.t0 = performance.now();
      if (sh) sh.classList.add("go");
      const d = $("#dt"); if (d) d.textContent = "❗ NOW!";
      m.t2 = setTimeout(() => dg(1, "Too slow!"), 650 * W);
    }, delay);
  };
  tick();
}
function dg(mult, txt) {
  const m = G.mini; if (m.done) return;
  m.done = 1; clearTimeout(m.t); clearTimeout(m.t2); clearTimeout(m.t3); G.lockUntil = performance.now() + 600; m.cb(mult, txt);
}
function dodgeTap() {
  const m = G.mini;
  if (m.ph === "cd") return;
  if (!m.go) return dg(1, "Too early!");
  const rt = performance.now() - m.t0;
  rt <= 340 * m.W ? dg(0, "Dodged!") : rt <= 650 * m.W ? dg(.5, "Partial dodge.") : dg(1, "Too slow!");
}

// ---- Resolving damage ----
function strike(f, o, base, tag, done) {
  if (base > 0 && G.p.indexOf(o) < G.n) {
    return dodge(o, o.n + ": get ready to dodge!", (mult, txt) => hit(f, o, Math.round(base * mult), tag + " " + txt, done, txt));
  }
  hit(f, o, base, tag, done, "Miss");
}
function hit(f, o, dmg, msg, done, zeroTxt) {
  const ab = Math.min(o.block, dmg), tot = dmg;
  o.block -= ab; dmg -= ab; o.hp -= dmg;
  G.anim = {a: G.p.indexOf(f), h: G.p.indexOf(o), big: dmg >= 10};
  sfx(dmg >= 10 ? "big" : dmg > 0 ? "hit" : tot === 0 ? "whoosh" : "block");
  G.fx = {i: G.p.indexOf(o), t: tot === 0 ? zeroTxt : dmg > 0 ? "-" + dmg : "Blocked"};
  G.log = msg + (tot ? " " + tot + " damage" : "") + (ab ? " (" + ab + " blocked)." : ".");
  if (o.hp <= 0) {
    o.hp = 0;
    if (G.pvp) finish(f.n + " wins!");
    else if (o === G.p[G.n]) win();
    else if (G.p.slice(0, G.n).every(x => x.hp <= 0)) finish("Your team was defeated.");
  }
  if (G.mode !== "end" && G.mode !== "reward") done();
  render();
}
function finish(msg) { G.mode = "end"; G.msg = msg; sfx(/defeated/.test(msg) ? "lose" : "win"); }
function opts() {
  const f = G.p[G.rw];
  return shuffle(Object.keys(CARDS).filter(k => k !== "defend" && (!CARDS[k].k || CARDS[k].k === f.cls))).slice(0, 3);
}
function win() {
  if (G.stage === ENEMIES.length - 1) {
    finish(G.n > 1 ? "You won the run together!" : "You won the run!"); wins++;
    try { localStorage.setItem("cb_wins", wins); } catch (e) {}
    return;
  }
  G.p.slice(0, G.n).forEach(f => { f.hp = f.hp > 0 ? Math.min(f.max, f.hp + 8) : 10; });
  G.mode = "reward"; G.rw = 0; G.opts = opts(); sfx("perfect");
}
function endTurn() {
  if (G.mode !== "play" || performance.now() < (G.lockUntil || 0)) return;
  const f = G.p[G.t];
  f.dc.push(...f.hand); f.hand = []; f.bank = G.energy;
  if (G.pvp) { G.log = f.n + " ended the turn."; G.t = 1 - G.t; G.mode = "pass"; return render(); }
  const nx = alive(G.t + 1);
  if (nx >= 0) { G.log = f.n + " ended the turn."; G.t = nx; G.mode = "pass"; return render(); }
  const e = G.p[G.n];
  if (poisonTick(e)) return render();
  e.block = 0;
  const [t, v] = e.mv[e.i % e.mv.length]; e.i++;
  const next = () => { aim(); G.t = alive(0); G.mode = G.n > 1 ? "pass" : "play"; if (G.n === 1) beginTurn(); };
  if (t === "a") {
    if (G.p[e.tg].hp <= 0) aim();
    const tg = G.p[e.tg];
    strike(e, tg, v, e.n + " attacks" + (G.n > 1 ? " " + tg.n : "") + "!", next);
  } else { e.block += v; G.log = e.n + " gains " + v + " block."; next(); render(); }
}
function pick(id) {
  if (id) G.p[G.rw].deck.push(id);
  if (++G.rw < G.n) G.opts = opts(); else { G.stage++; startFight(); }
  render();
}

// ---- Drawing the screen ----
function cardHTML(id, attrs) {
  const c = CARDS[id], k = c.d ? "a" : c.b ? "d" : "u";
  return `<button class="card ${k}" ${attrs}><b>${c.c}</b><span>${c.n}</span><small>${c.t}${c.m ? " · " + MGN[c.m] : ""}</small></button>`;
}
function helpHTML() {
  const keys = dev === "pc" ? "Keys: 1 to 9 play cards, E ends your turn, Space does the mini-games." : "Two players: lay the phone flat with one of you on each side. The screen turns toward whoever is acting.";
  return `<div class="panel col"><div class="name">How to play</div><div class="tag" style="text-align:left;line-height:1.7">🃏 You get 3 energy each turn, and unspent energy carries over (up to 10). Save up for big cards, or play Recharge to get more.<br>⚔️ Attack cards start a mini-game: timing, charge (hold and release), mash, or aim. A better score means more damage, and a miss does nothing.<br>🛡️ Block soaks damage until your next turn.<br>💨 When you are attacked, wait for the NOW signal, then tap. Ignore the fakes!<br>☠️ Poison hurts every turn. 💪 Strength adds damage to your attacks.<br>🏆 Beat every enemy to win, and pick a new card after each fight.<br>${keys}</div><button class="btn" data-a="help" data-v="0">Got it</button></div>`;
}
function menuHTML() {
  const btn = (a, v, t, s) => `<button class="btn alt" data-a="${a}" data-v="${v}">${t}${s ? `<br><span class="tag">${s}</span>` : ""}</button>`;
  if (!dev) return `<div class="panel col"><div class="name">Card Battler</div><div class="tag">Which device are you on?</div>${btn("dev", "phone", "📱 Phone or tablet", "Touch controls")}${btn("dev", "pc", "💻 Computer", "Mouse and keyboard")}</div>`;
  if (M.help) return helpHTML();
  let h = `<div class="panel col"><div class="name">Card Battler</div>`;
  if (!M.mode) { const two = dev === "pc" ? "2 players, same screen, taking turns" : "2 players, opposite sides of the phone"; h += btn("mode", "pve", "Vs computer", "1 player") + btn("mode", "coop", "Co-op vs computer", two) + btn("mode", "pvp", "Versus", two); }
  else if (M.mode !== "pvp" && !M.d) h += `<div class="tag">Choose a difficulty</div>` + Object.keys(DIFF).map(k => btn("d", k, DIFF[k].n, k === "nightmare" ? "enemy moves hidden" : "")).join("");
  else h += `<div class="tag">${M.mode === "pve" ? "Choose your class" : "Player " + (M.cls.length + 1) + ", choose your class"}</div>` +
    Object.keys(CLASSES).map(k => { const C = CLASSES[k];
      return btn("cls", k, C.e + " " + C.n, C.d + ". " + Object.values(CARDS).filter(c => c.k === k && c.m).map(c => c.n + " (" + MGN[c.m] + ")").join(", ")); }).join("");
  h += M.mode ? btn("new", "", "Back") : btn("help", "1", "How to play") + btn("dev", "", "Change device");
  return h + `<div class="tag">Runs won: ${wins}</div>${muteBtn()}</div>`;
}
function sheetHTML() {
  const m = G.mini, S = (t, s, body, b) => `<div class="sheet" id="sheet"><div class="name" id="dt">${t}</div><div class="tag" id="ds">${s}</div>${body}${b ? `<button class="btn" data-a="tap">${b}</button>` : ""}</div>`;
  const tr = `<div class="track"><i id="mk"></i></div>`;
  if (m.k === "time") return S("Time your attack!", "Tap when the marker is in the gold zone", tr, "TAP!");
  if (m.k === "hold") return S("Charge your attack!", "Hold the button, release in the gold zone", tr, "HOLD");
  if (m.k === "mash") return S("Mash!", `Tap fast: <b id="cnt">0</b> / ${m.N}`, "", "MASH!");
  if (m.k === "target") return S("Hit the targets!", `Tap each target before it vanishes: <b id="cnt">0 / 3</b>`, `<div class="arena" id="ar"><button class="tgt" id="tg" data-a="tgt">🎯</button></div>`);
  return S(m.title, "Get ready...", "", "DODGE");
}
// who the screen should face: the player who must act right now
function faceIdx() {
  if (!G.p || G.n < 2) return 0;
  const m = G.mini;
  if (G.mode === "mini" && m) return G.p.indexOf(m.k === "dg" ? m.o : m.f);
  if (G.mode === "reward") return G.rw;
  return G.t;
}
function render() {
  const app = $("#app");
  const flip = dev === "phone" && (G.p ? faceIdx() === 1 : M.mode && M.mode !== "pve" && M.cls && M.cls.length === 1);
  app.style.transform = flip ? "rotate(180deg)" : "";
  if (!G.p) { app.innerHTML = menuHTML(); return; }
  const f = G.p[G.t];
  if (G.mode === "pass") {
    app.innerHTML = `<div class="panel col"><div class="name">${f.n}, your turn</div>
    <div class="tag">${G.p.slice(0, G.pvp ? 2 : G.n).map(x => x.n + ": " + x.hp + " HP").join(", ")}</div>
    <div class="tag">${G.log}</div><button class="btn" data-a="go">Start turn</button></div>`;
    return;
  }
  const A = G.anim || {}, X = G.fx, RI = G.pvp ? 1 : G.n;
  let intent = "";
  if (!G.pvp) {
    const e = G.p[G.n], [t, v] = e.mv[e.i % e.mv.length];
    intent = DIFF[diff].hide ? "Next: ???" : t === "a" ? "Next: attacks " + (G.n > 1 ? G.p[e.tg].n + " " : "") + "for " + v : "Next: gains " + v + " block";
  }
  const fighter = i => {
    const x = G.p[i];
    return `<div class="fx ${i === RI ? "r" : "l"} ${G.t === i && G.mode !== "end" ? "act" : ""} ${x.hp <= 0 ? "dead" : ""}">
      ${X && X.i === i ? `<span class="float ${/^-/.test(X.t) ? "" : "ok"}">${X.t}</span>` : ""}
      <div class="spr ${A.a === i ? "lunge" : ""} ${A.h === i ? "hit" : ""}"><span class="big">${x.hp <= 0 ? "💀" : x.e}</span></div>
      <div class="name">${x.n}</div>
      <div class="bar"><i style="width:${x.hp / x.max * 100}%"></i></div>
      <div class="tag">${x.hp} / ${x.max} HP${x.block ? " · " + x.block + " block" : ""}${x.poison ? " · ☠" + x.poison : ""}${x.str ? " · 💪" + x.str : ""}</div>
      ${i === RI && !G.pvp ? `<div class="intent">${intent}</div>` : ""}</div>`;
  };
  const left = G.pvp ? [0] : [...Array(G.n).keys()];
  const label = G.pvp ? f.n + "’s turn" : (G.n > 1 ? f.n + "’s turn · " : "") + DIFF[diff].n + " · Fight " + (G.stage + 1) + " of " + ENEMIES.length;
  let h = `
  <div class="panel stage ${A.big ? "quake" : ""}">${left.map(fighter).join("")}<div class="vs">VS</div>${fighter(RI)}</div>
  <div id="log">${G.log}</div>
  <div class="row"><div class="stats"><span class="bl">Block ${f.block}</span><span class="en">Energy ${G.energy}</span></div><span class="tag">${label}</span>${muteBtn()}</div>
  <div class="hand ${G.deal ? "deal" : ""}">${f.hand.map((id, i) => cardHTML(id, `data-a="play" data-v="${i}" data-k="${i + 1}"` + (CARDS[id].c > G.energy ? " disabled" : ""))).join("")}</div>
  <button class="btn" data-a="end">End turn</button>`;
  if (G.mode === "mini") h += sheetHTML();
  if (G.mode === "reward") {
    h += `<div class="over"><div class="panel"><div class="name">${G.p[G.n].n} defeated!</div>
    <div class="tag">${G.p[G.rw].n}: choose a card to add to your deck</div>
    <div class="hand">${G.opts.map((id, i) => cardHTML(id, `data-a="pick" data-v="${id}" data-k="${i + 1}"`)).join("")}</div>
    <button class="btn alt" data-a="pick" data-v="">Skip</button></div></div>`;
  } else if (G.mode === "end") {
    h += `<div class="over"><div class="panel"><div class="name">${G.msg}</div>
    <div class="tag">Runs won: ${wins}</div><button class="btn" data-a="new">Back to menu</button></div></div>`;
  }
  app.innerHTML = h;
  G.anim = null; G.fx = null; G.deal = 0;
}
// mini-games use pointer events so taps react instantly
$("#app").addEventListener("pointerdown", ev => {
  if (ev.target.closest('[data-a="tap"]')) { ev.preventDefault(); tap(); }
  else if (ev.target.closest('[data-a="tgt"]')) { ev.preventDefault(); hitT(); }
});
document.addEventListener("pointerup", rel);
document.addEventListener("pointercancel", rel);
document.addEventListener("contextmenu", e => e.preventDefault());
// keyboard controls (computer version)
document.addEventListener("keydown", ev => {
  if (dev !== "pc" || !G.p || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key, sp = k === " " || k === "Spacebar";
  if (G.mode === "mini") { if (sp) { ev.preventDefault(); if (!ev.repeat) tap(); } }
  else if (G.mode === "play") {
    if (/^[1-9]$/.test(k) && G.p[G.t].hand[+k - 1]) play(+k - 1);
    else if (k === "e" || k === "E" || k === "Enter") { ev.preventDefault(); endTurn(); }
  } else if (G.mode === "pass") {
    if (sp || k === "Enter") { ev.preventDefault(); G.mode = "play"; beginTurn(); render(); }
  } else if (G.mode === "reward") {
    if (/^[1-3]$/.test(k) && G.opts[+k - 1]) pick(G.opts[+k - 1]); else if (k === "s" || k === "S") pick("");
  }
});
document.addEventListener("keyup", ev => { if (dev === "pc" && ev.key === " ") { ev.preventDefault(); rel(); } });
$("#app").addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === "play") play(+v);
  else if (a === "end") endTurn();
  else if (a === "pick") pick(v);
  else if (a === "go") { G.mode = "play"; beginTurn(); render(); }
  else if (a === "mute") { mute = !mute; try { localStorage.setItem("cb_mute", mute ? "1" : "0"); } catch (e) {} document.querySelectorAll('[data-a="mute"]').forEach(x => x.textContent = mute ? "🔇" : "🔊"); if (!mute) sfx("ok"); }
  else if (a === "help") { M.help = v === "1"; if (!M.help) { try { localStorage.setItem("cb_tut", "1"); } catch (e) {} } render(); }
  else if (a === "dev") { setDev(v); render(); }
  else if (a === "mode") { M = {mode: v, cls: []}; render(); }
  else if (a === "d") { M.d = v; render(); }
  else if (a === "cls") { M.cls.push(v); if (M.cls.length >= (M.mode === "pve" ? 1 : 2)) newGame(); render(); }
  else if (a === "new") { G = {}; M = {}; render(); }
});
render();
</script>
</body>
</html>
